<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Crime - Open World Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
  #game { border: 2px solid #333; image-rendering: pixelated; }

</style>

<body>
<canvas id="game" aria-label="City Crime: explore the city, steal vehicles, and complete missions"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
